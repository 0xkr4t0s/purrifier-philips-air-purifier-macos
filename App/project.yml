# XcodeGen spec for the Purrifier menu bar app (milestone M3).
#   brew install xcodegen
#   cd App && xcodegen generate && open Purrifier.xcodeproj
# The generated .xcodeproj is not committed.
name: Purrifier
options:
  # TODO(owner): replace "owner" with your reverse-DNS name (dev.<owner>.purrifier).
  bundleIdPrefix: dev.owner
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    # Universal binary (arm64 + x86_64) in Release.
    ARCHS: $(ARCHS_STANDARD)
    ONLY_ACTIVE_ARCH[config=Release]: NO
    DEAD_CODE_STRIPPING: YES

packages:
  PurrifierKit:
    path: ..

targets:
  Purrifier:
    type: application
    platform: macOS
    sources:
      - path: Purrifier
        excludes: ["*.md"]
    dependencies:
      - package: PurrifierKit
        product: AirLink
      - package: PurrifierKit
        product: PurifierModel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.owner.purrifier
        PRODUCT_NAME: Purrifier
        INFOPLIST_FILE: Purrifier/Info.plist
        CODE_SIGN_ENTITLEMENTS: Purrifier/Purrifier.entitlements
        CODE_SIGN_STYLE: Automatic
        # Set your team for local signing; CI signs with a Developer ID certificate.
        DEVELOPMENT_TEAM: ""
